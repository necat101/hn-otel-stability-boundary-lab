name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 evaluator.py
      - run: cat results.json
      - run: cat RESULTS.md
      - run: python3 -m unittest tests.test_stability_boundary -v
      - run: ./verify.sh
